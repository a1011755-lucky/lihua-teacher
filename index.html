<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>理化小老師 · 測試版</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--brand-dark:#1e3a8a;--ok:#15803d;--ok-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
header{background:var(--brand-dark);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0}
.tag{background:#fbbf24;color:#422006;font-size:12px;padding:2px 10px;border-radius:999px;font-weight:700}
nav{margin-left:auto;display:flex;gap:6px}
nav button{background:transparent;border:1px solid #93c5fd;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:15px;font-family:inherit}
nav button.on{background:#fff;color:var(--brand-dark);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px}
.lbl{font-weight:700;display:block;margin-bottom:6px}
textarea,input[type=text]{width:100%;font:inherit;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink)}
textarea:focus,input:focus{outline:2px solid #93c5fd;border-color:var(--brand)}
.chips{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.chip{border:1px solid #bfdbfe;background:#eff6ff;color:var(--brand-dark);border-radius:999px;padding:3px 12px;cursor:pointer;font:inherit;font-size:14px}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row label.grow{flex:1;min-width:220px;font-weight:700}
.btn{font:inherit;border-radius:10px;padding:9px 18px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.primary:hover{background:#1d4ed8}
.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.badge{border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-info{background:#dbeafe;color:var(--brand-dark)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){.grid{grid-template-columns:1fr 1.15fr}.sticky{position:sticky;top:12px;align-self:start}}
.step{border:1px solid var(--line);border-left:5px solid #cbd5e1;border-radius:10px;padding:10px 14px;margin-bottom:10px;background:#fff;transition:all .25s}
.step.active{border-left-color:var(--brand);box-shadow:0 2px 10px rgba(37,99,235,.12)}
.step h3{margin:0 0 4px;font-size:16px;color:var(--brand-dark)}
.step ul{margin:4px 0;padding-left:22px}
.formula{font-family:Consolas,"Cambria Math",monospace;background:#f1f5f9;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:17px;overflow-x:auto}
.answer{font-size:19px;font-weight:700;color:var(--brand-dark);background:#eff6ff;border-radius:8px;padding:6px 12px;display:inline-block;margin-top:6px}
.diag-ok{border-left-color:var(--ok)!important;background:var(--ok-soft)}
.diag-warn{border-left-color:var(--warn)!important;background:var(--warn-soft)}
.diag-bad{border-left-color:var(--bad)!important;background:var(--bad-soft)}
.stepnav{display:flex;gap:8px;flex-wrap:wrap}
canvas{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block;background:#fff}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.warnbox{background:var(--warn-soft);border-color:#fcd34d}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:150px}
.stat b{display:block;font-size:24px;color:var(--brand-dark)}
.stat span{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:14px}
.tbl-wrap{overflow-x:auto}
.st{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-wait{background:var(--warn-soft);color:var(--warn)}
.st-ai{background:#ede9fe;color:#6d28d9}
.qtext{max-width:420px}
.muted{color:var(--muted)}
.ops{display:flex;gap:4px;flex-wrap:wrap}
.tag.mode{background:#e0e7ff;color:#1e3a8a}
input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink)}
.photo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.photo-row label.btn{cursor:pointer}
.photo-box{display:flex;gap:12px;align-items:flex-start;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:10px;margin-bottom:12px}
.photo-box img{width:120px;max-height:160px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line)}
.photo-box .grow{flex:1;min-width:0}
.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.ai-steps .step{white-space:pre-wrap}
.ai-tag{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c4b5fd;border-top-color:#6d28d9;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.btn.busy{opacity:.6;pointer-events:none}
.grid.one{grid-template-columns:1fr!important}
[hidden]{display:none!important}
.unit{margin-bottom:22px}
.unit h3{font-size:17px;color:var(--brand-dark);margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid #dbeafe}
.sec{margin-bottom:12px}
.sec b{display:block;font-size:15px;margin-bottom:6px;color:#334155}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.lesson{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-size:14px;line-height:1.5;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.lesson:hover{border-color:#93c5fd;background:#f8fbff}
.lesson .ico{font-size:20px;line-height:1.2}
.sim{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🧪 理化小老師</h1><span class="tag">測試版</span><span id="mode" class="tag mode"></span>
  <nav>
    <button data-tab="ask" class="on">🙋 問問題</button>
    <button data-tab="learn">📘 單元動畫教室</button>
    <button data-tab="bank">📚 題庫（老師後台）</button>
  </nav>
</header>

<main>
<!-- ===== 問問題 ===== -->
<section id="tab-ask">
  <div class="card">
    <div class="photo-row">
      <label class="btn primary" for="photo">📷 拍照／選照片</label>
      <input type="file" id="photo" accept="image/*" hidden>
      <span class="muted">拍題目的照片，會自動轉成文字</span>
    </div>
    <div id="photoBox" class="photo-box" hidden>
      <img id="photoImg" alt="題目照片">
      <div class="grow">
        <div id="ocrMsg"></div>
        <div class="bar"><i id="ocrBar"></i></div>
        <button id="photoDel" class="btn small" type="button">✕ 移除照片</button>
      </div>
    </div>
    <label class="lbl" for="q">題目（可以直接貼學生的問題，或用上面的拍照）</label>
    <textarea id="q" rows="4" placeholder="例如：一輛汽車以 20 m/s 的速度行駛，看到紅燈後踩煞車，2秒後完全停止。請問煞車期間的加速度為多少 m/s²？"></textarea>
    <div class="chips">範例題：
      <button class="chip" data-ex="0">煞車求加速度</button>
      <button class="chip" data-ex="1">由靜止加速求速度</button>
      <button class="chip" data-ex="2">減速求時間</button>
      <button class="chip" data-ex="3">停下求滑行距離</button>
      <button class="chip" data-ex="4">F = m × a</button>
      <button class="chip" data-ex="5">萬有引力</button>
    </div>
    <div class="row">
      <label class="grow">學生算出來的答案（可不填，填了會幫忙找錯在哪）
        <input type="text" id="stu" inputmode="decimal" placeholder="例如 10">
      </label>
      <button id="go" class="btn primary">請老師解答</button>
    </div>
  </div>

  <div id="unknown" class="card warnbox" hidden></div>

  <div id="aiResult" class="card" hidden></div>

  <div id="result" hidden>
    <div id="badges" class="badges"></div>
    <div class="grid">
      <div class="card">
        <h2>一步一步講解</h2>
        <div id="steps"></div>
        <div class="stepnav">
          <button id="prev" class="btn">← 上一步</button>
          <button id="next" class="btn primary">下一步 →</button>
          <button id="all" class="btn">全部展開</button>
        </div>
      </div>
      <div class="card sticky" id="animCard">
        <h2>動畫</h2>
        <canvas id="cv" width="900" height="420"></canvas>
        <div class="row" style="margin-top:10px;align-items:center">
          <button id="play" class="btn primary">▶ 播放動畫</button>
          <label><input type="checkbox" id="tts"> 🔊 語音朗讀講解</label>
        </div>
        <p class="hint" id="animHint"></p>
      </div>
    </div>
  </div>
</section>

<!-- ===== 單元動畫教室 ===== -->
<section id="tab-learn" hidden>
  <div class="card">
    <h2>📘 單元動畫教室（國三上）</h2>
    <p class="muted" style="margin-top:0">點一題就能看「一步一步講解＋動畫」。學生問到一樣的題目（打字或拍照）時，也會直接用這裡的講解，不花 AI 費用。</p>
    <div id="learnList"></div>
  </div>
</section>

<!-- ===== 題庫 ===== -->
<section id="tab-bank" hidden>
  <div id="loginBox" class="card" hidden>
    <div id="loginOut">
      <b>老師登入</b><span class="muted">（登入後才能審核、刪除題目；學生不用登入）</span>
      <div class="row" style="margin-top:8px">
        <label class="grow">Email<input type="text" id="em" autocomplete="username"></label>
        <label class="grow">密碼<input type="password" id="pw" autocomplete="current-password"></label>
        <button id="loginBtn" class="btn primary">登入</button>
      </div>
      <p id="loginMsg" class="muted" style="margin:8px 0 0"></p>
    </div>
    <div id="loginIn" hidden>👩‍🏫 已登入：<b id="who"></b> <button id="logoutBtn" class="btn small">登出</button></div>
  </div>
  <div id="bankErr" class="errbox" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="margin:0">題庫</h2>
      <div class="ops">
        <button id="export" class="btn small">⬇ 匯出備份（JSON）</button>
        <button id="clear" class="btn small">清空題庫</button>
      </div>
    </div>
    <p class="muted" style="margin-top:0" id="bankWhere"></p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>題目</th><th>答案</th><th>被問次數</th><th>學生常見錯誤答案</th><th>狀態</th><th>操作</th></tr></thead>
      <tbody id="bankRows"></tbody>
    </table></div>
  </div>
</section>
</main>

<!-- Firebase（雲端題庫）；沒網路或還沒設定時，會自動改用本機題庫 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="scenes.js"></script>
<script src="lessons.js"></script>
<script src="bank-index.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const EXAMPLES = [
  "一輛汽車以 20 m/s 的速度行駛，看到紅燈後踩煞車，2秒後完全停止。請問煞車期間的加速度為多少 m/s²？",
  "一台機車由靜止開始，以 3 m/s² 的加速度出發，請問 4 秒後的速度為多少？",
  "一輛汽車以 15 m/s 行駛，煞車時以 5 m/s² 減速，請問汽車經過多久會停下來？",
  "一顆球以 10 m/s 的速度在地面滾動，受摩擦力影響，5 秒後停止。請問滑行距離為多少公尺？",
  "質量 3 kg 的物體受到 15 N 向右的拉力，地面摩擦力為 3 N，請問物體的加速度是多少？",
  "兩個物體之間的萬有引力是 F。如果質量都不變，兩物體的距離變成原來的 2 倍，萬有引力會變成多少？"
];
const NAMES = {v0:"初速 v₀", v:"末速 v", a:"加速度 a", t:"時間 t", s:"位移 s"};
const SYM = {v0:"v₀", v:"v", a:"a", t:"t", s:"s"};
const UNIT = {v0:"m/s", v:"m/s", a:"m/s²", t:"s", s:"m"};

/* ---------- 數字格式 ---------- */
function fmt(x){
  if(typeof x!=="number"||!isFinite(x)) return "?";
  let r = Math.round(x*1000)/1000; if(Object.is(r,-0)) r = 0;
  return (r<0?"−":"") + String(Math.abs(r));
}
const par = x => x<0 ? "("+fmt(x)+")" : fmt(x);
const approx = (a,b) => Math.abs(a-b) <= Math.max(0.011, Math.abs(b)*0.01);

/* ---------- 題目辨識 ---------- */
function normalize(t){
  return t.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/．/g,".").replace(/／/g,"/").replace(/[－−]/g,"-")
    .replace(/ｍ/g,"m").replace(/ｓ/g,"s").replace(/\s+/g," ");
}
const NUM = "(-?\\d+(?:\\.\\d+)?)";
const CHOICE_RE = /[\(（]\s*([A-Da-d])\s*[\)）]\s*(-?\d+(?:\.\d+)?)\s*(?:公尺|公分|公里|m\/s²|m\/s|km\/h|m|秒|s|kg|N|牛頓)?/g;
// 選擇題：找出和答案一樣的選項
function choicesOf(raw){ return [...normalize(raw).matchAll(CHOICE_RE)].map(m=>({c:m[1].toUpperCase(), v:+m[2]})); }
function pickChoice(raw, val){ const c = choicesOf(raw).find(o=>approx(o.v, val)); return c ? c.c : null; }
function parseQuestion(raw){
  let full = normalize(raw);
  // 學生在題目裡自己寫的答案，例如「我算出來是 10」
  let stu = null;
  const sm = full.match(/算出(?:來)?(?:的答案)?(?:是|為|得)?\s*(-?\d+(?:\.\d+)?)/);
  if(sm) stu = +sm[1];
  // 去掉「參考解題 SOP」「易錯陷阱」等補充說明
  let text = full.split(/【\s*(?:參考|易錯|解題)/)[0];
  // 選擇題的選項「(A)50 (B)40…」不是已知數，先拿掉
  text = text.replace(CHOICE_RE, " ");
  const q = {v0:null, v:null, a:null, t:null, s:null};
  const notes = [];
  let rest = text;
  const accs=[], vels=[], times=[], dists=[];
  rest = rest.replace(new RegExp(NUM+"\\s*(?:m\\/s\\^?2|m\\/s²|m\\/s\\/s|公尺\\/秒\\^?2|公尺\\/秒²|公尺\\/秒平方|公尺每秒平方)","gi"), (_,n)=>{accs.push(+n); return " ";});
  rest = rest.replace(new RegExp(NUM+"\\s*(km\\/h|公里\\/小時|m\\/s|公尺\\/秒|公尺每秒)","gi"), (_,n,u)=>{
    let x = +n;
    if(/km|公里/i.test(u)){ x = x/3.6; notes.push(`${n} ${u} 要先換成 m/s：${n} ÷ 3.6 = ${fmt(x)} m/s`); }
    vels.push(x); return " ";
  });
  rest = rest.replace(new RegExp(NUM+"\\s*(秒鐘|秒|sec|s(?![a-z]))","gi"), (_,n)=>{times.push(+n); return " ";});
  rest = rest.replace(new RegExp(NUM+"\\s*(公尺|m(?![a-z\\/]))","gi"), (_,n)=>{dists.push(+n); return " ";});

  const fromRest = /(由|從)靜止|靜止(開始|出發|起動|啟動)/.test(text);
  const stops = /停(止|下|住|了)|煞停|靜止下來/.test(text);
  const decel = /煞車|剎車|減速|變慢/.test(text);
  if(fromRest){ q.v0 = 0; notes.push("「由靜止開始」→ 初速 v₀ = 0"); }
  if(stops){ q.v = 0; notes.push("「停下來／完全停止」→ 末速 v = 0"); }
  let vi = 0;
  if(q.v0===null && vels[vi]!==undefined) q.v0 = vels[vi++];
  if(q.v===null && vels[vi]!==undefined) q.v = vels[vi++];
  if(accs.length){
    q.a = accs[0];
    if(decel && q.a>0){ q.a = -q.a; notes.push(`「煞車／減速」→ 加速度和前進方向相反，所以是負的：a = ${fmt(q.a)} m/s²`); }
  }
  if(times.length) q.t = times[0];
  if(dists.length) q.s = dists[0];

  // 要求的是什麼
  const idx = Math.max(text.lastIndexOf("請問"), text.lastIndexOf("求"), text.lastIndexOf("則"));
  const ask = idx>=0 ? text.slice(idx) : text.split(/[，。,]/).slice(-2).join("");
  let target = null;
  if(/加速度/.test(ask)) target = "a";
  else if(/位移|距離|多遠|滑行|(?:移動|前進|行進|行駛|飛行?|跑|走|爬|游)了?(?:多少|幾)|多少(?:公尺|公里|m)/.test(ask)) target = "s";
  else if(/時間|多久|幾秒|多少秒/.test(ask)) target = "t";
  else if(/初速/.test(ask)) target = "v0";
  else if(/末速|速度|速率|多快/.test(ask)) target = "v";
  if(target) q[target] = null;
  // 只有一個速度、沒提到加速或減速 → 等速運動
  if((target==="s" || target==="t") && vels.length===1 && !accs.length && !fromRest && !stops && !decel
     && !/加速|減速|變快|變慢/.test(text) && q.a===null){
    q.a = 0; q.v = q.v0;
    notes.push(`題目沒有提到加速或減速 → <b>等速運動</b>：速度一直是 ${fmt(q.v0)} m/s，a = 0`);
  }
  return {q, target, notes, stu, decel, stops, fromRest};
}

/* ---------- 解題 ---------- */
const RULES = [
  {out:"s", need:["v0","t"], ok:k=>k.a===0, f:k=>k.v0*k.t,
   formula:"s = v × t", sub:k=>`s = ${fmt(k.v0)} × ${par(k.t)}`,
   why:"等速運動：速度一直不變，所以 位移 ＝ 速度 × 時間。"},
  {out:"t", need:["v0","s"], ok:k=>k.a===0 && k.v0!==0, f:k=>k.s/k.v0,
   formula:"t = s ÷ v", sub:k=>`t = ${fmt(k.s)} ÷ ${par(k.v0)}`,
   why:"等速運動：時間 ＝ 位移 ÷ 速度。"},
  {out:"a", need:["v0","v","t"], ok:k=>k.t!==0, f:k=>(k.v-k.v0)/k.t,
   formula:"a = (v − v₀) ÷ t", sub:k=>`a = (${fmt(k.v)} − ${par(k.v0)}) ÷ ${par(k.t)}`,
   why:"加速度 ＝「速度的變化」÷「花的時間」。速度的變化一定是 <b>末速 − 初速</b>（後面的減前面的）。"},
  {out:"v", need:["v0","a","t"], f:k=>k.v0+k.a*k.t,
   formula:"v = v₀ + a × t", sub:k=>`v = ${fmt(k.v0)} + ${par(k.a)} × ${par(k.t)}`,
   why:"末速 ＝ 初速 ＋ 這段時間內速度增加（或減少）的量。"},
  {out:"t", need:["v0","v","a"], ok:k=>k.a!==0, f:k=>(k.v-k.v0)/k.a,
   formula:"t = (v − v₀) ÷ a", sub:k=>`t = (${fmt(k.v)} − ${par(k.v0)}) ÷ ${par(k.a)}`,
   why:"由 v = v₀ + a × t 移項：時間 ＝ 速度的變化 ÷ 加速度。"},
  {out:"v0", need:["v","a","t"], f:k=>k.v-k.a*k.t,
   formula:"v₀ = v − a × t", sub:k=>`v₀ = ${fmt(k.v)} − ${par(k.a)} × ${par(k.t)}`,
   why:"由 v = v₀ + a × t 移項。"},
  {out:"s", need:["v0","v","t"], f:k=>(k.v0+k.v)/2*k.t,
   formula:"s = (v₀ + v) ÷ 2 × t", sub:k=>`s = (${fmt(k.v0)} + ${par(k.v)}) ÷ 2 × ${par(k.t)}`,
   why:"速度一直在變，不能直接用「速度 × 時間」。等加速度時，平均速度 ＝ (初速 ＋ 末速) ÷ 2，位移 ＝ 平均速度 × 時間。"},
  {out:"s", need:["v0","a","t"], f:k=>k.v0*k.t+0.5*k.a*k.t*k.t,
   formula:"s = v₀ × t + ½ × a × t²", sub:k=>`s = ${fmt(k.v0)} × ${par(k.t)} + ½ × ${par(k.a)} × ${par(k.t)}²`,
   why:"等加速度運動的位移公式。"},
  {out:"s", need:["v0","v","a"], ok:k=>k.a!==0, f:k=>(k.v*k.v-k.v0*k.v0)/(2*k.a),
   formula:"v² = v₀² + 2 × a × s", sub:k=>`s = (${par(k.v)}² − ${par(k.v0)}²) ÷ (2 × ${par(k.a)})`,
   why:"題目沒給時間，就用這條不含 t 的公式。"},
  {out:"a", need:["v0","v","s"], ok:k=>k.s!==0, f:k=>(k.v*k.v-k.v0*k.v0)/(2*k.s),
   formula:"v² = v₀² + 2 × a × s", sub:k=>`a = (${par(k.v)}² − ${par(k.v0)}²) ÷ (2 × ${par(k.s)})`,
   why:"題目沒給時間，就用這條不含 t 的公式。"},
  {out:"t", need:["v0","v","s"], ok:k=>k.v0+k.v!==0, f:k=>2*k.s/(k.v0+k.v),
   formula:"s = (v₀ + v) ÷ 2 × t", sub:k=>`t = 2 × ${par(k.s)} ÷ (${fmt(k.v0)} + ${par(k.v)})`,
   why:"位移 ＝ 平均速度 × 時間，移項求時間。"}
];
function solve(q, target){
  const k = {...q}, steps = [];
  const has = x => typeof k[x]==="number" && isFinite(k[x]);
  const can = r => !has(r.out) && r.need.every(has) && (!r.ok || r.ok(k));
  const apply = (r, rec) => { const sub = r.sub(k); k[r.out] = r.f(k); if(rec) steps.push({...r, subText:sub, val:k[r.out]}); };
  for(let i=0; i<8 && !has(target); i++){
    const r = RULES.find(r=>r.out===target && can(r)) || RULES.find(r=>r.out!=="s" && can(r)) || RULES.find(can);
    if(!r) break; apply(r, true);
  }
  for(let i=0; i<8; i++){ const r = RULES.find(can); if(!r) break; apply(r, false); }   // 補齊動畫需要的數字
  return {k, steps, ok: has(target)};
}

/* ---------- 找學生錯在哪 ---------- */
function diagnose(target, k, x){
  const c = k[target];
  if(approx(x, c)) return {cls:"diag-ok", html:"<b>答對了！👏</b> 你的答案和正確答案一樣。"};
  const tips = [];
  if(c!==0 && approx(x, -c)){
    tips.push(target==="a"
      ? "大小算對了，但<b>正負號相反</b>。你很可能算成「初速 − 末速」。公式一定是 <b>末速 − 初速</b>（後面的減前面的），照順序代進去，負號會自己出現，不用另外加。"
      : "大小算對了，但<b>正負號相反</b>。回到第一步，確認哪個方向是正的，再檢查每個數字的正負號。");
  }
  if(c!==0 && (approx(x, c*3.6) || approx(x, c/3.6)))
    tips.push("單位沒換對：km/h 換成 m/s 要 <b>÷ 3.6</b>（m/s 換成 km/h 才是 × 3.6）。");
  if(target==="a"){
    if(approx(Math.abs(x), Math.abs(k.v-k.v0)) && k.t!==1) tips.push("你算的是「速度的變化」，還要<b>再除以時間</b>才是加速度。");
    if(approx(Math.abs(x), Math.abs((k.v-k.v0)*k.t)) && k.t!==1) tips.push("速度的變化要<b>除以</b>時間，不是乘以時間。");
  }
  if(target==="s"){
    if(approx(x, k.v0*k.t)) tips.push("你用了「速度 × 時間」，但這只適用在<b>速度不變</b>的時候。這題速度一直在變，要用平均速度 (v₀ + v) ÷ 2 再乘時間。");
    if(approx(x, k.v0*k.t + k.a*k.t*k.t)) tips.push("位移公式裡 a × t² 前面要乘 <b>½</b>，你可能漏掉了。");
  }
  if(target==="v"){
    if(k.v0!==0 && approx(x, k.a*k.t)) tips.push("你算出的是「增加的速度」，還要<b>加上初速</b>才是末速。");
  }
  if(target==="t"){
    if(k.v!==k.v0 && approx(Math.abs(x), Math.abs(k.a/(k.v-k.v0)))) tips.push("除法上下顛倒了：時間 ＝ 速度的變化 <b>÷</b> 加速度。");
  }
  if(tips.length) return {cls:"diag-warn", html:tips.join("<br>"), known:true};
  return {cls:"diag-bad", html:`你的答案 ${fmt(x)} 和正確答案 ${fmt(c)} 不一樣，而且從算式看不出是哪一步錯了。<br>這種情況，正式版會交給 <b>AI 老師</b>分析（測試版還沒接上 AI）。`};
}

/* ---------- 組講解步驟 ---------- */
function meaning(target, k){
  const v = k[target];
  if(target==="a"){
    if(v===0) return "加速度是 0，代表速度沒有改變（等速運動）。";
    const same = (v>0) === (k.v0>0);
    if(k.v0===0) return `加速度是${v>0?"正":"負"}的，物體會往${v>0?"右（正方向）":"左（負方向）"}越跑越快。`;
    return same
      ? "加速度和速度<b>同號</b>（方向相同），所以越來越快。"
      : `${v<0?"負號":"正號"}代表加速度的方向和前進方向<b>相反</b>，所以越來越慢。<br>小口訣：<b>速度和加速度同號 → 越來越快；異號 → 越來越慢。</b>`;
  }
  if(target==="v") return v<0 ? "負號代表最後是往<b>左（負方向）</b>運動。" : v===0 ? "末速為 0，代表最後停下來了。" : `最後以 ${fmt(v)} m/s 往右（正方向）運動。`;
  if(target==="t") return v<0 ? "算出負的時間，代表題目的條件互相矛盾（例如加速度方向不可能讓它停下來），請再檢查題目。" : `經過 ${fmt(v)} 秒。`;
  if(target==="s") return v<0 ? `位移是負的，代表最後停在出發點<b>左邊</b> ${fmt(-v)} 公尺。` : `代表最後在出發點<b>右邊</b> ${fmt(v)} 公尺的地方。在速度–時間圖上，這就是藍色那塊的<b>面積</b>。`;
  return "";
}
function buildSteps(p, sol, stuAns){
  const {q, target, notes} = p, k = sol.k, steps = [];
  steps.push({title:"第一步：定義正方向", anim:"start",
    html:"以物體一開始前進的方向為正，也就是<b>向右為正</b>。<br>往右的速度、加速度是正的；往左就是負的。"});
  const known = ["v0","v","a","t","s"].filter(x=>q[x]!==null)
    .map(x=>`<li>${NAMES[x]} = ${fmt(q[x])} ${UNIT[x]}</li>`).join("");
  const noteHtml = notes.length ? `<div class="muted" style="font-size:14px">題目的關鍵字：<ul>${notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>` : "";
  steps.push({title:"第二步：列出已知數", anim:"start",
    html:`<ul>${known}<li><b>要求的：${NAMES[target]} = ?</b></li></ul>${noteHtml}`});
  const calc = sol.steps.map(s=>`<div>${s.why}</div><div class="formula">${s.formula}</div><div class="formula">${s.subText} = <b>${fmt(s.val)} ${UNIT[s.out]}</b></div>`).join("");
  steps.push({title:"第三步：挑選公式、代入計算", anim:"play", html:calc});
  steps.push({title:"第四步：答案是什麼意思？", anim:"none",
    html:`<div class="answer">答案：${SYM[target]} = ${fmt(k[target])} ${UNIT[target]}</div><div style="margin-top:8px">${meaning(target,k)}</div>`});
  let diag = null;
  if(stuAns!==null){
    diag = diagnose(target, k, stuAns);
    steps.push({title:`你的答案（${fmt(stuAns)}）哪裡不一樣？`, anim:"none", cls:diag.cls, html:diag.html});
  }
  return {steps, diag};
}

/* ---------- 題庫：有設定 Firebase 就存雲端，沒有就存在這台電腦 ---------- */
const BANK_KEY = "lihua-bank-v1";
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(BANK_KEY)) || []; }catch(e){ return []; } }
function saveLocal(b){ try{ localStorage.setItem(BANK_KEY, JSON.stringify(b)); }catch(e){} }
function hashId(str){   // 同一題 → 同一個編號（雲端就不會重複存）
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1^ch, 2654435761); h2 = Math.imul(h2^ch, 1597334677); }
  h1 = Math.imul(h1^(h1>>>16), 2246822507) ^ Math.imul(h2^(h2>>>13), 3266489909);
  h2 = Math.imul(h2^(h2>>>16), 2246822507) ^ Math.imul(h1^(h1>>>13), 3266489909);
  return "q" + (4294967296*(2097151&h2) + (h1>>>0)).toString(36);
}
function bankKey(p){
  if(!p.target) return "raw|" + normalize(p.raw).replace(/\s/g,"");
  const r = x => x===null ? "_" : Math.round(x*1000)/1000;
  return `kin|${p.target}|v0=${r(p.q.v0)}|v=${r(p.q.v)}|a=${r(p.q.a)}|t=${r(p.q.t)}|s=${r(p.q.s)}`;
}
function cleanQuestion(raw){
  // 只留下題目本身，去掉學生的發問與參考解法
  const m = raw.match(/【題目】[：:]?\s*([\s\S]*?)(?=【|$)/);
  return (m ? m[1] : raw.split(/【\s*(?:參考|易錯|解題)/)[0]).trim() || raw.trim();
}
const Store = (()=>{
  const cfg = window.FIREBASE_CONFIG || {};
  let cloud = false, db = null, auth = null;
  try{
    if(typeof firebase!=="undefined" && cfg.apiKey && cfg.projectId && !/請貼上/.test(cfg.apiKey)){
      firebase.initializeApp(cfg); db = firebase.firestore(); auth = firebase.auth(); cloud = true;
    }
  }catch(e){ console.warn("Firebase 初始化失敗，改用本機題庫", e); }
  const col = () => db.collection("questions");
  const inc = () => firebase.firestore.FieldValue.increment(1);
  return {
    cloud, auth,
    // 記錄一次發問；wrongAns = 學生的錯誤答案（答對或沒填就是 null）
    async record(entry, wrongAns){
      entry.question = cleanQuestion(entry.question);
      const id = hashId(entry.key), now = Date.now();
      const fresh = () => ({...entry, askCount:1, wrong: wrongAns!==null ? {[wrongAns]:1} : {},
                            status: entry.solved ? "待審核" : "待 AI 解答", createdAt:now, lastAt:now});
      if(cloud){
        const ref = col().doc(id), snap = await ref.get();
        if(snap.exists){
          const args = ["askCount", inc(), "lastAt", now];
          if(wrongAns!==null) args.push(new firebase.firestore.FieldPath("wrong", wrongAns), inc());
          await ref.update(...args);
          const r = {id, ...snap.data()}; r.askCount++;
          return {r, hit:true};
        }
        const r = fresh(); await ref.set(r);
        return {r:{id, ...r}, hit:false};
      }
      const bank = loadLocal();
      let r = bank.find(b=>b.id===id || b.key===entry.key), hit = !!r;
      if(r){ r.askCount++; r.lastAt = now; if(wrongAns!==null){ r.wrong = r.wrong||{}; r.wrong[wrongAns] = (r.wrong[wrongAns]||0)+1; } }
      else{ r = {id, ...fresh()}; bank.unshift(r); }
      saveLocal(bank);
      return {r, hit};
    },
    // 讀整個題庫；雲端模式會即時更新
    subscribe(cb){
      if(cloud) return col().onSnapshot(
        s=>cb(s.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.lastAt||0)-(a.lastAt||0))),
        err=>cb(null, err));
      cb(loadLocal()); return null;
    },
    // 把 AI 老師的解答存進題庫（下次同一題就不用再花錢）
    async saveAI(id, ai){
      const patch = {ai, answer: ai.answer.slice(0,380), solved:true, type:"AI 解答", status:"待審核", lastAt:Date.now()};
      if(cloud) return col().doc(id).update(patch);
      const b = loadLocal(), r = b.find(x=>x.id===id); if(r){ Object.assign(r, patch); saveLocal(b); }
    },
    async setStatus(id, status){
      if(cloud) return col().doc(id).update({status});
      const b = loadLocal(), r = b.find(x=>x.id===id); if(r){ r.status = status; saveLocal(b); }
    },
    async remove(id){
      if(cloud) return col().doc(id).delete();
      saveLocal(loadLocal().filter(x=>x.id!==id));
    },
    async clearAll(ids){
      if(cloud){ const batch = db.batch(); ids.forEach(id=>batch.delete(col().doc(id))); return batch.commit(); }
      saveLocal([]);
    }
  };
})();

/* ---------- 講解播放 ---------- */
let cur = {steps:[], idx:0};
function renderSteps(){
  const box = $("#steps");
  box.innerHTML = cur.steps.map((s,i)=>`<div class="step ${s.cls||""} ${i===cur.idx?"active":""}" ${i>cur.idx?"hidden":""}><h3>${s.title}</h3>${s.html}</div>`).join("");
  $("#prev").disabled = cur.idx===0;
  $("#next").disabled = cur.idx>=cur.steps.length-1;
}
function goStep(i, opts={}){
  cur.idx = Math.max(0, Math.min(cur.steps.length-1, i));
  renderSteps();
  const s = cur.steps[cur.idx];
  if(!opts.silent) speak(s.title + "。" + s.html);
  if(s.anim==="play") Scenes.play(); else if(s.anim==="start") Scenes.reset(); else if(s.anim==="end") Scenes.end();
  const el = $("#steps").children[cur.idx];
  if(el && opts.scroll!==false) el.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function toSpeech(html){
  const d = document.createElement("div"); d.innerHTML = html.replace(/<br>|<\/div>|<\/li>/g,"。");
  return d.textContent
    .replace(/m\/s²/g,"公尺每平方秒").replace(/m\/s/g,"公尺每秒")
    .replace(/v₀/g,"初速").replace(/ − /g," 減 ").replace(/−/g,"負")
    .replace(/÷/g,"除以").replace(/×/g,"乘以").replace(/=/g,"等於").replace(/½/g,"二分之一").replace(/²/g,"平方")
    .replace(/[→（）()]/g," ");
}
function speak(html){
  try{
    if(!$("#tts").checked || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(toSpeech(html));
    u.lang = "zh-TW"; u.rate = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- 單元題庫（lessons.js）：比對學生的題目 ---------- */
const LESSONS = [];
(window.LESSON_UNITS||[]).forEach(u=>u.sections.forEach(s=>s.items.forEach(it=>{ it.unit = u.name; it.sec = s.name; LESSONS.push(it); })));
const textKey = s => normalize(s).split(/【\s*(?:參考|易錯|解題)/)[0].replace(/(?:我)?算出(?:來)?.*$/,"")
  .replace(/[\s，。,.?？!！、：:；;（）()「」『』〔〕\[\]]/g,"").toLowerCase();
function bigrams(s){ const m = new Map(); for(let i=0;i<s.length-1;i++){ const b = s.slice(i,i+2); m.set(b,(m.get(b)||0)+1); } return m; }
function dice(a, b){
  let inter = 0, na = 0, nb = 0;
  for(const v of a.values()) na += v; for(const v of b.values()) nb += v;
  for(const [k,v] of a) if(b.has(k)) inter += Math.min(v, b.get(k));
  return na+nb ? 2*inter/(na+nb) : 0;
}
// 數字＋單位的「指紋」：數字或單位不一樣，就一定不是同一題（例如 2 kg 和 2 kgw）
const UNIT_RE = /(\d+(?:\.\d+)?)(kgw|公斤重|kg|公斤|千克|km\/h|公里\/小時|m\/s²|m\/s\^?2|m\/s|cm\/s|公尺\/秒|公尺|公分|公里|cm|km|m|n|牛頓|秒|s|小時|h|次|倍|度|°)?/g;
const UNIT_ALIAS = {"公斤重":"kgw","公斤":"kg","千克":"kg","公里/小時":"km/h","m/s^2":"m/s²","m/s2":"m/s²","公尺/秒":"m/s","公尺":"m","公分":"cm","公里":"km","牛頓":"n","秒":"s","小時":"h","°":"度"};
const numsOf = s => [...s.matchAll(UNIT_RE)].map(m=>(+m[1]) + (UNIT_ALIAS[m[2]] || m[2] || "")).sort().join(",");
function rankLessons(raw){
  const k = textKey(raw), bg = bigrams(k), ns = numsOf(k);
  return LESSONS.map(L=>{
    if(!L._bg){ const lk = textKey(L.q); L._bg = bigrams(lk); L._ns = numsOf(lk); }
    const sc = dice(bg, L._bg);
    return {L, sc, same: (L._ns || "") === ns};   // same：數字和單位都一樣
  }).sort((a,b)=>b.sc-a.sc);
}
// 回傳 {L}：確定是這題；{pick:[…]}：很像，請學生確認；null：題庫沒有
// 題庫指紋（bank-index.js）：學生問到老師題庫裡的原題 → 拿到標準答案和題型
const h24 = s => { let h = 0x811c9dc5; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) & 0xffffff; };
let BANK = null, BANK_FULL = 0.6, BANK_STEM = 0.7;
function bankHit(raw){
  if(!window.BANK_INDEX) return null;
  if(!BANK) BANK = BANK_INDEX.map(([t, a, st, full, ns])=>({t, a, st:new Set(st.split(".")), full:new Set(full.split(".")), ns}));
  const k = textKey(raw), q = new Set();
  for(let i=0;i<k.length-1;i++) q.add(h24(k.slice(i,i+2)).toString(36));
  const stemKey = textKey(normalize(raw).split(/\(A\)|（A）/)[0]);
  const ns = h24(numsOf(stemKey)).toString(36);
  const cand = [];
  for(const b of BANK){
    if(b.ns !== ns) continue;   // 數字或單位不一樣，就不是同一題
    let si = 0, fi = 0;
    for(const x of b.st) if(q.has(x)) si++;
    for(const x of b.full) if(q.has(x)) fi++;
    cand.push({b, stem: si/b.st.size, full: 2*fi/(b.full.size+q.size)});
  }
  if(!cand.length) return null;
  // 先看整題（含選項）；整題不夠像，才看題幹
  cand.sort((x,y)=>y.full-x.full);
  const f0 = cand[0];
  const hasOpts = /[\(（]\s*[AB]\s*[\)）]/i.test(raw);   // 沒有選項時，只能比題幹
  if(hasOpts && f0.full >= BANK_FULL && !cand.some(c=>c!==f0 && c.full >= f0.full - 0.03 && c.b.a!==f0.b.a))
    return {type: f0.b.t, ans: f0.b.a, sc: f0.full};
  cand.sort((x,y)=>y.stem-x.stem);
  const top = cand[0];
  if(top.stem < BANK_STEM) return null;
  // 好幾題題幹一樣（例如「附圖…何者錯誤？」），答案又不同 → 只看題幹分不出來
  if(cand.some(c=>c!==top && c.stem >= top.stem - 0.03 && c.b.a!==top.b.a)) return null;
  return {type: top.b.t, ans: top.b.a, sc: top.stem};
}
// 題型：同一題、數字不同 → 把學生的數字代進講解和動畫
function instLesson(L, raw){
  const vals = window.lessonVals ? lessonVals(L, normalize(raw)) : null;
  if(!vals) return null;
  const same = L.defaults && Object.keys(vals).every(k=>approx(vals[k], L.defaults[k]));
  if(same) return L;
  const made = L.make(vals);
  if(!made) return null;
  return Object.assign({}, L, made, {q: cleanQuestion(raw), vals, inst:true});
}
function matchLesson(raw){
  const ranked = rankLessons(raw);
  const ok = ranked.filter(x=>x.same);
  const top = ok[0], second = ok[1];
  if(top && (top.sc >= 0.42 || (top.sc >= 0.25 && top.sc - (second ? second.sc : 0) >= 0.12))) return {L: top.L};
  // 數字不一樣，但題型一樣
  for(const x of ranked.filter(x=>x.L.make && x.sc >= 0.4)){ const I = instLesson(x.L, raw); if(I) return {L: I}; }
  if(!top || top.sc < 0.22) return null;
  return {pick: ok.filter(x=>x.sc >= 0.2).slice(0, 3).map(x=>x.L)};
}
function diagLesson(L, x){
  if([L.num, ...(L.alt||[])].some(v=>typeof v==="number" && approx(x, v)))
    return {cls:"diag-ok", html:"<b>答對了！👏</b>" + (L.alt && L.alt.length ? "　這題問了不只一個答案，記得每一個都要回答。" : "")};
  const m = (L.mistakes||[]).find(m=>approx(x, m.n));
  if(m) return {cls:"diag-warn", html:m.tip, known:true};
  return {cls:"diag-bad", html:`你的答案 ${fmt(x)} 和正確答案（${esc(L.ans)}）不一樣。請從第一步開始，一步一步對照，看看是哪裡不同。`};
}
function showLesson(L, stuAns, extraBadge, scroll, exam){
  const steps = L.steps.map(s=>({title:s.t, html:s.h, anim:s.anim||"none"}));
  if(exam){   // 老師題庫的原題：先給這題的答案，下面是同觀念的例題講解
    const you = exam.letter ? (exam.letter===exam.ans
        ? `<div class="step diag-ok" style="margin-top:8px"><b>你選 (${exam.letter})，答對了！👏</b></div>`
        : `<div class="step diag-warn" style="margin-top:8px">你選 (${exam.letter})，正確答案是 <b>(${exam.ans})</b>。看下面同觀念的講解和動畫，想想差在哪裡。</div>`) : "";
    steps.unshift({title:"這一題的答案", anim:"none", html:`<div class="answer">答案：(${exam.ans})</div>${you}<div class="muted" style="margin-top:8px">接下來用一題<b>同觀念的例題</b>，一步一步講解這個觀念（按「下一步」）。</div>`});
    steps[1] = {...steps[1], html:`<div class="muted" style="font-size:14px;margin-bottom:6px">📘 同觀念例題：${esc(L.q)}</div>` + steps[1].html};
    showWalk({badges:`<span class="badge b-ok">✅ 老師題庫的題目 · 答案取自老師的解答本 · 0 token</span><span class="badge b-info">📘 ${esc(L.sec)}</span>`, steps, scene:L.scene, scroll});
    return null;
  }
  steps[0] = {...steps[0], html:`<div class="muted" style="font-size:14px;margin-bottom:6px">${L.inst ? "📘 題庫題型（已換成你題目的數字）" : "📘 題庫題目"}：${esc(L.q)}</div>` + steps[0].html};
  // 選擇題：在答案旁邊標出要選哪一個
  const choice = typeof L.num==="number" ? pickChoice(L.q, L.num) : null;
  if(choice){ const st = steps.find(s=>/class="answer"/.test(s.html)); if(st) st.html = st.html.replace(/(<div class="answer">[^<]*)/, `$1　→ 選 <b>(${choice})</b>`); }
  let diag = null;
  if(stuAns!==null && stuAns!==undefined){
    diag = typeof L.num==="number" ? diagLesson(L, stuAns)
      : {cls:"diag-bad", html:`這題的答案是文字說明：${esc(L.ans)}。對照看看你的想法一不一樣。`};
    steps.push({title:`你的答案（${fmt(stuAns)}）`, anim:"none", cls:diag.cls, html:diag.html});
  }
  showWalk({badges:`<span class="badge b-info">📘 ${esc(L.sec)}</span><span class="badge b-ok">👩‍🏫 老師準備的動畫講解 · 0 token</span>` + (extraBadge||""),
            steps, scene:L.scene, scroll});
  return diag;
}
function similarHtml(raw){
  const list = rankLessons(raw).filter(x=>x.sc >= 0.22).slice(0, 3);
  if(!list.length) return "";
  return `<p style="margin-bottom:4px">📘 題庫裡有<b>類似的題目</b>，可以先看看：</p><div class="sim">` +
    list.map(x=>`<button class="chip" data-lesson="${x.L.id}">${esc(x.L.q.slice(0, 26))}…</button>`).join("") + "</div>";
}

/* ---------- 牛頓第二定律模板（F = m × a） ---------- */
const FORCE_RE = new RegExp(NUM + "\\s*(kgw|公斤重|牛頓|N(?![a-z]))", "gi");
const MASS_RE = new RegExp(NUM + "\\s*(kg(?!w)|公斤(?!重)|千克)", "gi");
const ACC_RE = new RegExp(NUM + "\\s*(?:m\\/s\\^?2|m\\/s²|m\\/s\\/s|公尺\\/秒\\^?2|公尺\\/秒²|公尺\\/秒平方|公尺每秒平方)", "gi");
function parseNewton(raw){
  const text = normalize(raw).split(/【\s*(?:參考|易錯|解題)/)[0];
  const gm = text.match(/g\s*=\s*(\d+(?:\.\d+)?)/i), G = gm ? +gm[1] : 9.8;
  const forces = [], masses = [], accs = [], notes = [];
  for(const m of text.matchAll(FORCE_RE)){
    const n = +m[1], kgw = /kgw|公斤重/i.test(m[2]), i = m.index, win = text.slice(Math.max(0, i-8), i + m[0].length + 6);
    const friction = /摩擦/.test(win);
    let dir = /向左|往左|向西|往西/.test(win) ? "left" : "right";
    if(friction) dir = "left";
    const v = kgw ? n*G : n;
    if(kgw) notes.push(`${n} kgw 要換成牛頓：${n} × ${G} = ${fmt(v)} N`);
    forces.push({v, dir, kind: friction ? "friction" : "applied", label: friction ? "摩擦力" : "拉力"});
  }
  for(const m of text.matchAll(MASS_RE)) masses.push(+m[1]);
  for(const m of text.matchAll(ACC_RE)) accs.push(+m[1]);
  const idx = Math.max(text.lastIndexOf("請問"), text.lastIndexOf("求"), text.lastIndexOf("則"));
  const ask = idx>=0 ? text.slice(idx) : text.slice(-20);
  let target = null;
  if(/加速度/.test(ask)) target = "a";
  else if(/質量/.test(ask)) target = "m";
  else if(/重量|重力|多重/.test(ask) && masses.length && !forces.length) target = "W";
  else if(/力|牛頓/.test(ask)) target = "F";
  if(!target) return null;
  const m = masses[0], a = accs[0];
  const net = forces.reduce((s,f)=>s + (f.dir==="right" ? f.v : -f.v), 0);
  if(target==="a" && m>0 && forces.length) return {target, m, forces, net, val: net/m, notes, G};
  if(target==="F" && m>0 && typeof a==="number") return {target, m, a, val: m*a, notes, G};
  if(target==="m" && forces.length && a>0) return {target, a, forces, net, val: Math.abs(net)/a, notes, G};
  if(target==="W" && m>0) return {target, m, val: m*G, notes, G};
  return null;
}
function newtonWalk(n, stuAns){
  const F_ = s => `<div class="formula">${s}</div>`, steps = [];
  const fl = n.forces || [];
  const known = [];
  if(n.m!=null && n.target!=="m") known.push(`質量 m = ${fmt(n.m)} kg`);
  fl.forEach(f=>known.push(`${f.label} = ${fmt(f.v)} N（${f.dir==="right"?"向右":"向左"}）`));
  if(n.a!=null) known.push(`加速度 a = ${fmt(n.a)} m/s²`);
  const ask = {a:"加速度 a", F:"合力 F", m:"質量 m", W:"重量 W"}[n.target];
  const noteHtml = n.notes.length ? `<div class="muted" style="font-size:14px">${n.notes.join("<br>")}</div>` : "";
  steps.push({title:"第一步：列出已知數", anim:"start", html:`<ul>${known.map(k=>`<li>${k}</li>`).join("")}<li><b>要求的：${ask} = ?</b></li></ul>${noteHtml}`});
  let ans = "";
  if(n.target==="a" || n.target==="m"){
    const rights = fl.filter(f=>f.dir==="right").map(f=>fmt(f.v)), lefts = fl.filter(f=>f.dir==="left").map(f=>fmt(f.v));
    const expr = (rights.join(" + ")||"0") + (lefts.length ? " − " + lefts.join(" − ") : "");
    steps.push({title:"第二步：先算合力", anim:"none", html: fl.length>1
      ? "方向相同的力相加、方向相反的力相減（摩擦力和運動方向相反）：" + F_(`合力 = ${expr} = <b>${fmt(Math.abs(n.net))} N</b>`)
      : `只有一個水平力，合力 ＝ <b>${fmt(Math.abs(n.net))} N</b>。`});
    if(n.target==="a"){
      steps.push({title:"第三步：牛頓第二定律", anim:"play", html: F_("合力 F = m × a → a = F ÷ m") + F_(`a = ${fmt(Math.abs(n.net))} ÷ ${fmt(n.m)} = <b>${fmt(Math.abs(n.val))} m/s²</b>`)});
      ans = `a = ${fmt(Math.abs(n.val))} m/s²`;
    }else{
      steps.push({title:"第三步：牛頓第二定律", anim:"play", html: F_("F = m × a → m = F ÷ a") + F_(`m = ${fmt(Math.abs(n.net))} ÷ ${fmt(n.a)} = <b>${fmt(n.val)} kg</b>`)});
      ans = `m = ${fmt(n.val)} kg`;
    }
  }else if(n.target==="F"){
    steps.push({title:"第二步：牛頓第二定律", anim:"play", html: F_("合力 F = m × a") + F_(`F = ${fmt(n.m)} × ${fmt(n.a)} = <b>${fmt(n.val)} N</b>`)});
    ans = `F = ${fmt(n.val)} N`;
  }else{
    steps.push({title:"第二步：重量的公式", anim:"play", html: F_("W = m × g") + F_(`W = ${fmt(n.m)} × ${fmt(n.G)} = <b>${fmt(n.val)} N</b>`) + `也就是 ${fmt(n.m)} kgw（公斤重）。`});
    ans = `W = ${fmt(n.val)} N`;
  }
  steps.push({title:"最後：答案", anim:"none", html:`<div class="answer">答案：${ans}</div><div style="margin-top:8px">F ＝ m × a 的 F 是物體受到的<b>合力</b>；合力越大加速度越大，質量越大加速度越小。</div>`});
  let diag = null;
  if(stuAns!==null){
    const c = Math.abs(n.val), tips = [];
    if(approx(stuAns, c)) diag = {cls:"diag-ok", html:"<b>答對了！👏</b>"};
    else{
      if(n.target==="a"){
        if(approx(stuAns, Math.abs(n.net)*n.m)) tips.push("a ＝ F <b>÷</b> m，不是 F × m。");
        if(approx(stuAns, n.m/Math.abs(n.net))) tips.push("除法上下顛倒了：a ＝ 合力 ÷ 質量。");
        const ap = fl.filter(f=>f.kind!=="friction").reduce((s,f)=>s+f.v,0);
        if(fl.length>1 && approx(stuAns, ap/n.m)) tips.push("要用<b>合力</b>算，不能只用拉力：記得減掉摩擦力。");
        if(fl.length>1 && approx(stuAns, fl.reduce((s,f)=>s+f.v,0)/n.m)) tips.push("方向相反的力要<b>相減</b>，不是相加。");
      }
      if(n.target==="F"){ if(approx(stuAns, n.m/n.a)) tips.push("F ＝ m <b>×</b> a，不是 m ÷ a。"); }
      if(n.target==="m"){ if(approx(stuAns, Math.abs(n.net)*n.a)) tips.push("m ＝ F <b>÷</b> a，不是 F × a。"); }
      if(n.target==="W"){ if(approx(stuAns, n.m/n.G)) tips.push("W ＝ m <b>×</b> g。"); if(approx(stuAns, n.m)) tips.push(`${fmt(n.m)} 是質量（kg），重量要再乘 g：${fmt(n.m)} × ${fmt(n.G)}。`); }
      diag = tips.length ? {cls:"diag-warn", html:tips.join("<br>"), known:true}
        : {cls:"diag-bad", html:`你的答案 ${fmt(stuAns)} 和正確答案 ${fmt(c)} 不一樣，請從第一步開始對照看看。`};
    }
    steps.push({title:`你的答案（${fmt(stuAns)}）哪裡不一樣？`, anim:"none", cls:diag.cls, html:diag.html});
  }
  let scene;
  if(n.target==="W") scene = {type:"forces", m:n.m, obj:"物體", surface:"none", static:true, forces:[{label:"重力 W", v:n.val, dir:"down", kind:"weight"}], showNet:false};
  else if(n.target==="F") scene = {type:"forces", m:n.m, obj:"物體", surface:"none", v0:0, T:3, forces:[{label:"合力 F", v:n.val, dir:"right"}], showNet:false};
  else scene = {type:"forces", m: n.target==="m" ? n.val : n.m, obj:"物體", surface: fl.some(f=>f.kind==="friction") ? "rough" : "smooth", v0:0, T:3, forces: fl};
  const r = x => Math.round(x*1000)/1000;
  const key = `newton|${n.target}|m=${n.m==null?"_":r(n.m)}|a=${n.a==null?"_":r(n.a)}|F=${fl.map(f=>f.dir[0]+r(f.v)).sort().join(",")}`;
  return {steps, diag, scene, ans, key};
}

/* ---------- 主流程 ---------- */
function bankBadge(saved, hit, r){
  if(!saved) return `<span class="badge b-warn">⚠ 這次沒存進題庫（${r}）</span>`;
  return (hit ? `<span class="badge b-ok">✅ 題庫裡已有這題（第 ${r.askCount} 次被問）· 0 token</span>`
              : `<span class="badge b-info">🆕 新題目，已存進${Store.cloud?"雲端":""}題庫 · 由解題模板算出 · 0 token</span>`) +
    (r.status==="已審核" ? `<span class="badge b-ok">👩‍🏫 老師已審核</span>` : `<span class="badge b-warn">⏳ 等老師審核</span>`);
}
function saveErrText(e){
  const code = (e && e.code) || "";
  if(/permission/.test(code)) return "雲端拒絕寫入，可能是安全規則還沒發布";
  if(/unavailable|network/.test(code)) return "連不上雲端，請檢查網路";
  return (e && e.message) || "未知錯誤";
}
let skipLessonOnce = false;
async function ask(){
  const raw = $("#q").value.trim();
  if(!raw && !photoData){ $("#q").focus(); return; }
  if(ocrBusy){ alert("照片還在辨識中，請等一下。"); return; }
  const go = $("#go"); go.classList.add("busy"); go.textContent = "老師思考中…";
  $("#aiResult").hidden = true;
  try{
    if(!raw){   // 只有照片、沒有文字 → 直接請 AI 老師看照片
      $("#result").hidden = true; $("#unknown").hidden = true;
      if(AI_URL) await runAI("", null, null); else showUnknown("照片沒有辨識出文字，請在題目欄打字。");
      return;
    }
    const p = parseQuestion(raw); p.raw = raw;
    const stuRaw = normalize($("#stu").value).trim();
    const stuIn = stuRaw.match(/-?\d+(?:\.\d+)?/);
    let stuAns = stuIn ? +stuIn[0] : p.stu;
    const stuLetter = stuRaw.match(/^[\(（]?\s*([A-Da-d])\s*[\)）]?$/);   // 選擇題填「B」也可以
    if(stuLetter){ const o = choicesOf(raw).find(o=>o.c===stuLetter[1].toUpperCase()); if(o) stuAns = o.v; }
    // ① 單元題庫裡有這題 → 用老師準備好的動畫講解
    // ⓪ 老師題庫裡的原題 → 標準答案＋題型講解（模板算得出、而且和標準答案一樣時，用模板的計算過程）
    const bh = skipLessonOnce ? null : bankHit(raw);
    if(bh){
      let tv = null; const nw0 = parseNewton(raw);
      if(nw0) tv = Math.abs(nw0.val); else if(p.target){ const s0 = solve(p.q, p.target); if(s0.ok) tv = s0.k[p.target]; }
      const tmplOk = tv!==null && pickChoice(raw, tv)===bh.ans;
      const TL = LESSONS.find(x=>x.id===(window.TYPE_LESSON||{})[bh.type]);
      if(!tmplOk && TL){
        showLesson(TL, null, "", false, {ans: bh.ans, letter: stuLetter ? stuLetter[1].toUpperCase() : null});
        const wrong = stuLetter && stuLetter[1].toUpperCase()!==bh.ans ? stuLetter[1].toUpperCase() : null;
        try{ await Store.record({key:"bank|"+bh.type+"|"+hashId(textKey(raw)), question:raw, solved:true, type:"題庫原題", answer:"("+bh.ans+")"}, wrong); }
        catch(e){ console.warn(e); }
        return;
      }
    }
    const mt = skipLessonOnce ? null : matchLesson(raw);
    skipLessonOnce = false;
    if(mt && mt.pick){   // 很像題庫裡的題目 → 請學生確認是哪一題
      $("#result").hidden = true;
      $("#unknown").hidden = false;
      $("#unknown").innerHTML = `<h2>📘 是不是這一題？</h2><p class="muted" style="margin-top:0">題庫裡有很像的題目，點一下就能看動畫講解：</p>
        <div class="sim">${mt.pick.map(L=>`<button class="lesson" data-lesson="${L.id}"><span>${esc(L.q)}</span></button>`).join("")}</div>
        <p style="margin-bottom:0"><button class="btn small" id="notThese">都不是，請老師解答</button></p>`;
      $("#notThese").onclick = ()=>{ skipLessonOnce = true; ask(); };
      return;
    }
    const L = mt && mt.L;
    if(L){
      const diag = showLesson(L, stuAns);
      const wrongAns = (stuAns!==null && diag && diag.cls!=="diag-ok") ? fmt(stuAns) : null;
      const vkey = L.inst ? "|" + Object.entries(L.vals).map(([k,v])=>k+"="+v).join("|") : "";
      try{ await Store.record({key:"lesson|"+L.id+vkey, question:L.q, solved:true, type:"單元題庫", answer:L.ans.slice(0,380)}, wrongAns); }
      catch(e){ console.warn(e); }
      return;
    }
    // ② F = m × a 計算題 → 牛頓第二定律模板
    const nw = parseNewton(raw);
    if(nw){
      const w = newtonWalk(nw, stuAns);
      const wrongAns = (stuAns!==null && w.diag && w.diag.cls!=="diag-ok") ? fmt(stuAns) : null;
      let badge;
      try{
        const {r, hit} = await Store.record({key:w.key, question:raw, solved:true, type:"牛頓第二定律", answer:w.ans}, wrongAns);
        badge = bankBadge(true, hit, r);
      }catch(e){ console.warn(e); badge = bankBadge(false, false, saveErrText(e)); }
      showWalk({badges:badge, steps:w.steps, scene:w.scene});
      return;
    }
    // ③ 等加速度直線運動模板
    const sol = p.target ? solve(p.q, p.target) : null;
    const key = bankKey(p);
    if(!sol || !sol.ok){
      $("#result").hidden = true; $("#unknown").hidden = true;
      let rec = null, note = "";
      try{
        rec = await Store.record({key, question:raw, solved:false, type:"未辨識"}, null);
        note = `這題已經存進題庫的<b>「待 AI 解答」</b>清單${rec.hit?`（已經被問過 ${rec.r.askCount} 次）`:""}。`;
      }catch(e){ note = `⚠ 這題沒能存進題庫（${saveErrText(e)}）。`; }
      if(rec && rec.r.ai){ showAI(rec.r.ai, {fromBank:true, r:rec.r, stuAns}); return; }   // 題庫裡已有 AI 解答 → 0 token
      if(AI_URL){ await runAI(raw, stuAns, rec ? rec.r.id : null); return; }
      showUnknown(note + "老師會盡快補上解答（附動畫），之後再問就看得到。", raw);
      return;
    }
    const built = buildSteps(p, sol, stuAns);
    const choice = pickChoice(raw, sol.k[p.target]);
    if(choice){ const st = built.steps.find(s=>/答案是什麼意思/.test(s.title)); if(st) st.html = st.html.replace("</div>", `　→ 選 <b>(${choice})</b></div>`); }
    const correct = built.diag ? built.diag.cls==="diag-ok" : true;
    const wrongAns = (stuAns!==null && !correct) ? fmt(stuAns) : null;
    let badge;
    try{
      const {r, hit} = await Store.record({key, question:raw, solved:true, type:"直線運動", target:p.target,
        answer:`${SYM[p.target]} = ${fmt(sol.k[p.target])} ${UNIT[p.target]}`}, wrongAns);
      badge = bankBadge(true, hit, r);
    }catch(e){ console.warn(e); badge = bankBadge(false, false, saveErrText(e)); }
    showWalk({badges:badge, steps:built.steps, scene:kinScene(sol.k)});
  }finally{
    go.classList.remove("busy"); go.textContent = "請老師解答";
  }
}

const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function showUnknown(note, raw){
  $("#unknown").hidden = false;
  $("#unknown").innerHTML = `<h2>🤔 這題還沒有現成的講解</h2>
    <p>目前會的：<b>國三上第一、二章的單元題庫</b>（看「📘 單元動畫教室」）、<b>等加速度直線運動</b>計算題、<b>F = m × a</b> 計算題。</p>
    <p>${note}</p>${raw ? similarHtml(raw) : ""}`;
}

/* ---------- 拍照 → 文字（在手機上辨識，免費） ---------- */
const TESS_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let photoData = null, ocrBusy = false, ocrWorker = null, ocrJob = 0;
function loadScript(src){
  return new Promise((ok, bad)=>{ const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ()=>bad(new Error("載入失敗")); document.head.appendChild(s); });
}
function readImage(file){
  return new Promise((ok, bad)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); ok(img); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); bad(new Error("這個檔案不是照片，或格式不支援")); };
    img.src = url;
  });
}
// 縮小照片（太大會很慢、也比較貴）
function shrink(img, max){
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
// 辨識出來的中文字中間常會多空格、斷行，整理一下
function cleanOcr(t){
  const CJK = "[\\u2E80-\\u9FFF\\uFF00-\\uFFEF\\u3000-\\u303F]";
  return t.replace(new RegExp(`(${CJK})[ \\t]+(?=${CJK})`,"g"), "$1")
          .replace(new RegExp(`(${CJK})[ \\t]+(?=[0-9A-Za-z])`,"g"), "$1")
          .replace(new RegExp(`([0-9A-Za-z²])[ \\t]+(?=${CJK})`,"g"), "$1")
          .replace(/\n{2,}/g, "\n").replace(/(\S)\n(?=\S)/g, "$1")
          .replace(/m\s*\/\s*s\s*[?？2]\s*[?？]/g, "m/s²？")              // 「²」常被認成「?」
          .replace(/m\/s\^?2(?![0-9])/g, "m/s²")
          .replace(/\s*,\s*(?=[一-鿿])/g, "，").trim();
}
function setOcr(msg, pct){
  $("#ocrMsg").innerHTML = msg;
  $("#ocrBar").parentElement.hidden = pct==null;
  if(pct!=null) $("#ocrBar").style.width = Math.round(pct*100) + "%";
}
async function onPhoto(file){
  const job = ++ocrJob;
  let img;
  try{ img = await readImage(file); }catch(e){ alert(e.message); return; }
  photoData = shrink(img, 1568).toDataURL("image/jpeg", 0.85);
  $("#photoImg").src = photoData; $("#photoBox").hidden = false;
  ocrBusy = true; setOcr("📖 正在看照片裡的字…（第一次會下載辨識資料，要等一下）", 0.02);
  try{
    if(!window.Tesseract) await loadScript(TESS_URL);
    if(!ocrWorker) ocrWorker = await Tesseract.createWorker(["chi_tra","eng"], 1, {
      logger: m => { if(job===ocrJob && typeof m.progress==="number")
        setOcr(m.status==="recognizing text" ? "📖 辨識文字中…" : "⬇ 下載辨識資料中…（只有第一次）", m.status==="recognizing text" ? 0.3+m.progress*0.7 : m.progress*0.3); }
    });
    const {data} = await ocrWorker.recognize(shrink(img, 2000));
    if(job!==ocrJob) return;   // 中途換了照片
    const text = cleanOcr(data.text || "");
    const zh = (text.match(/[一-鿿]/g)||[]).length;
    if(zh >= 6){
      $("#q").value = text;
      setOcr(`✅ 辨識完成！<b>請檢查下面的題目文字</b>，有錯字直接改，再按「請老師解答」。`, null);
    }else{
      $("#q").value = "";
      setOcr(AI_URL ? "⚠ 照片裡的字看不太清楚（可能是手寫或太模糊）。可以直接按「請老師解答」，交給 AI 老師看照片。"
                    : "⚠ 照片裡的字看不太清楚（可能是手寫或太模糊），請重拍或直接打字。", null);
    }
  }catch(e){
    console.warn(e);
    if(job===ocrJob) setOcr("⚠ 文字辨識失敗（" + esc(e.message||e) + "）。" + (AI_URL ? "可以直接按「請老師解答」，交給 AI 老師看照片。" : "請直接打字。"), null);
  }finally{
    if(job===ocrJob) ocrBusy = false;
  }
}
function clearPhoto(){ ocrJob++; ocrBusy = false; photoData = null; $("#photoBox").hidden = true; $("#photoImg").removeAttribute("src"); }

/* ---------- AI 老師（經過中繼站呼叫 Claude；金鑰不放在網頁裡） ---------- */
const AI_URL = (window.AI_URL || "").trim();
async function runAI(raw, stuAns, id){
  const box = $("#aiResult");
  box.hidden = false;
  box.innerHTML = `<p><span class="spin"></span> 🤖 AI 老師正在看題目，大約 10～40 秒…</p>`;
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
  let ai;
  try{
    const res = await fetch(AI_URL, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question: raw, studentAnswer: stuAns, image: photoData})});
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || ("錯誤代碼 " + res.status));
    ai = data;
  }catch(e){
    box.innerHTML = `<h2>⚠ AI 老師暫時沒辦法回答</h2><p>${esc(e.message)}</p><p class="muted">可以過一下再按一次「請老師解答」。</p>`;
    return;
  }
  const mistake = ai.mistake; delete ai.mistake;   // 「錯在哪」是給這個學生的，不存進題庫
  let r = null, saved = "";
  if(!ai.notPhysics){
    try{
      if(!id){   // 只有照片的題目：用 AI 整理出的題目文字建檔
        const p = parseQuestion(ai.question); p.raw = ai.question;
        const rec = await Store.record({key: bankKey(p), question: ai.question, solved:false, type:"未辨識"}, null);
        id = rec.r.id; r = rec.r;
        if(r.ai){ showAI(ai, {r, stuAns, mistake}); return; }
      }
      await Store.saveAI(id, ai);
      saved = "ok";
    }catch(e){ console.warn(e); saved = saveErrText(e); }
  }
  showAI(ai, {saved, stuAns, mistake});
}
function showAI(ai, o){
  let badge;
  if(o.fromBank) badge = `<span class="badge b-ok">✅ 題庫裡已有老師／AI 的解答（第 ${o.r.askCount} 次被問）· 0 token</span>` +
    (o.r.status==="已審核" ? `<span class="badge b-ok">👩‍🏫 老師已審核</span>` : `<span class="badge b-warn">⏳ 等老師審核</span>`);
  else badge = `<span class="badge b-info">🤖 AI 老師解答</span>` +
    (o.saved==="ok" ? `<span class="badge b-info">已存進題庫，下次同一題不用再花 AI 費用</span><span class="badge b-warn">⏳ 等老師審核</span>`
                    : o.saved ? `<span class="badge b-warn">⚠ 沒存進題庫（${esc(o.saved)}）</span>` : "");
  if(ai.topic) badge += `<span class="badge b-info">${esc(ai.topic)}</span>`;
  if(ai.notPhysics){   // 照片看不清楚、不是題目
    const box = $("#aiResult"); box.hidden = false; $("#result").hidden = true;
    box.innerHTML = `<div class="badges"><span class="badge b-warn">這題沒有存進題庫</span></div><h2>🤖 AI 老師</h2><p>${esc(ai.answer)}</p>`;
    return;
  }
  const body = s => esc(s).replace(/\n/g, "<br>");
  const steps = (ai.steps||[]).map((s, i)=>({title:`第 ${i+1} 步　${esc(s.title)}`, html: body(s.body), anim: i===0 ? "play" : "none"}));
  if(ai.question && steps.length) steps[0].html = `<div class="muted" style="font-size:14px;margin-bottom:6px">題目：${esc(ai.question)}</div>` + steps[0].html;
  steps.push({title:"答案", anim:"end", html:`<div class="answer">答案：${esc(ai.answer)}</div><p class="hint">AI 也可能算錯，老師審核過的解答會標示「👩‍🏫 老師已審核」。</p>`});
  if(o.mistake) steps.push({title:"🔍 你的答案", anim:"none", cls:"diag-warn", html: body(o.mistake)});
  else if(o.fromBank && o.stuAns!==null && o.stuAns!==undefined)
    steps.push({title:`🔍 你的答案是 ${esc(fmt(o.stuAns))}`, anim:"none", html:"和上面的答案比對看看；不一樣的話，從第 1 步開始找哪裡不同。"});
  showWalk({badges:badge, steps, scene:ai.scene, scroll:true});
}

/* ---------- 單元動畫教室 ---------- */
const SCENE_ICON = {motion:"🚗", pendulum:"⏱️", forces:"📦", inertia:"🚌", action:"⛸️", circular:"🔄", gravity:"🌍"};
function renderLearn(){
  $("#learnList").innerHTML = (window.LESSON_UNITS||[]).map(u=>`<div class="unit"><h3>${esc(u.name)}</h3>` +
    u.sections.map(s=>`<div class="sec"><b>${esc(s.name)}</b><div class="lessons">` +
      s.items.map(L=>`<button class="lesson" data-lesson="${L.id}"><span class="ico">${SCENE_ICON[L.scene && L.scene.type] || "📘"}</span><span>${esc(L.q)}</span></button>`).join("") +
    `</div></div>`).join("") + `</div>`).join("");
}
function openLesson(id, keepAns){
  const L = LESSONS.find(x=>x.id===id); if(!L) return;
  showTab("ask"); clearPhoto();
  const s = keepAns ? normalize($("#stu").value).match(/-?\d+(?:\.\d+)?/) : null;
  $("#q").value = L.q; if(!keepAns) $("#stu").value = "";
  showLesson(L, s ? +s[0] : null, "", true);
}

/* ---------- 題庫畫面 ---------- */
let bankCache = [], bankUnsub = null, isAdmin = false;
const ADMINS = (window.ADMIN_EMAILS || []).map(s=>s.toLowerCase());
const canEdit = () => !Store.cloud || isAdmin;
function loadBankView(){
  if(!Store.cloud){ Store.subscribe(list=>{ bankCache = list; renderBank(); }); return; }
  if(bankUnsub) return;   // 雲端模式已經在即時更新
  bankUnsub = Store.subscribe((list, err)=>{
    if(err){ $("#bankErr").hidden = false; $("#bankErr").textContent = "讀取雲端題庫失敗：" + saveErrText(err); return; }
    $("#bankErr").hidden = true; bankCache = list; renderBank();
  });
}
function renderBank(){
  const bank = bankCache;
  $("#bankWhere").innerHTML = Store.cloud
    ? "☁ 題庫存在<b>雲端（Firebase）</b>，所有學生共用，畫面會自動更新。" + (canEdit() ? "" : "　<b>老師登入後</b>才能審核、刪除。")
    : "💻 題庫目前存在<b>這台電腦的瀏覽器</b>裡（還沒設定雲端）。";
  $("#clear").hidden = !canEdit();
  const asks = bank.reduce((s,b)=>s+(b.askCount||0),0);
  const reused = bank.reduce((s,b)=>s+(b.solved ? (b.askCount||1)-1 : 0),0);
  const waiting = bank.filter(b=>!b.solved && !(matchLesson(b.question)||{}).L).length;
  $("#stats").innerHTML = `
    <div class="stat"><b>${bank.length}</b><span>題庫題數</span></div>
    <div class="stat"><b>${asks}</b><span>學生總共問了幾次</span></div>
    <div class="stat"><b>${reused}</b><span>直接從題庫拿答案（省下的 AI 呼叫）</span></div>
    <div class="stat"><b>${waiting}</b><span>待解答（請 Claude 補上）</span></div>`;
  if(!bank.length){ $("#bankRows").innerHTML = `<tr><td colspan="6" class="muted">題庫還是空的，先到「問問題」問幾題看看。</td></tr>`; return; }
  const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const edit = canEdit();
  $("#bankRows").innerHTML = bank.map(b=>{
    const wrong = Object.entries(b.wrong||{}).sort((x,y)=>y[1]-x[1]).map(([a,n])=>`${esc(a)}（${n} 人）`).join("、") || "<span class='muted'>—</span>";
    const lm = !b.solved ? matchLesson(b.question) : null;
    const st = lm && lm.L ? `<span class="st st-ok">已有單元講解</span><div class="muted" style="font-size:12px">學生再問會看到 ${esc(lm.L.id)}，這筆可刪除</div>`
      : !b.solved ? `<span class="st st-ai">待解答</span>` : b.status==="已審核" ? `<span class="st st-ok">已審核</span>` : `<span class="st st-wait">待審核</span>`;
    return `<tr>
      <td class="qtext">${esc(b.question)}</td>
      <td>${b.answer ? esc(b.answer) : "<span class='muted'>—</span>"}</td>
      <td>${b.askCount||0}</td>
      <td>${wrong}</td>
      <td>${st}</td>
      <td><div class="ops">
        ${edit && b.solved ? `<button class="btn small" data-act="approve" data-id="${b.id}">${b.status==="已審核"?"取消審核":"✔ 審核通過"}</button>` : ""}
        <button class="btn small" data-act="view" data-id="${b.id}">再看一次</button>
        ${edit ? `<button class="btn small" data-act="del" data-id="${b.id}">刪除</button>` : ""}
      </div></td></tr>`;
  }).join("");
}

function showTab(name){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===name));
  $("#tab-ask").hidden = name!=="ask"; $("#tab-bank").hidden = name!=="bank"; $("#tab-learn").hidden = name!=="learn";
  if(name==="learn") renderLearn();
  if(name==="bank"){ renderBank(); loadBankView(); }
}

/* ---------- 老師登入（只有雲端模式需要） ---------- */
$("#mode").textContent = Store.cloud ? "☁ 雲端題庫" : "💻 本機題庫";
if(Store.cloud){
  $("#loginBox").hidden = false;
  Store.auth.onAuthStateChanged(u=>{
    isAdmin = !!u && ADMINS.includes((u.email||"").toLowerCase());
    $("#loginOut").hidden = !!u; $("#loginIn").hidden = !u;
    $("#who").textContent = u ? u.email + (isAdmin ? "" : "（不是管理員帳號，不能審核）") : "";
    renderBank();
  });
  $("#loginBtn").onclick = async ()=>{
    const msg = $("#loginMsg"); msg.textContent = "登入中…";
    try{
      await Store.auth.signInWithEmailAndPassword($("#em").value.trim(), $("#pw").value);
      $("#pw").value = ""; msg.textContent = "";
    }catch(e){
      const c = e.code || "";
      msg.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "Email 或密碼不對。"
        : /too-many-requests/.test(c) ? "嘗試太多次，請稍後再試。"
        : /operation-not-supported|unauthorized-domain/.test(c) ? "用這個網址打開時不能登入（直接雙擊檔案打開不行），請改用網站網址。"
        : "登入失敗：" + (e.message || c);
    }
  };
  $("#pw").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#loginBtn").click(); });
  $("#logoutBtn").onclick = ()=>Store.auth.signOut();
}

/* ---------- 事件 ---------- */
document.querySelectorAll("nav button").forEach(b=>b.onclick = ()=>showTab(b.dataset.tab));
document.querySelectorAll(".chip[data-ex]").forEach(c=>c.onclick = ()=>{ clearPhoto(); $("#q").value = EXAMPLES[+c.dataset.ex]; $("#stu").value = ""; });
$("#photo").onchange = e=>{ const f = e.target.files && e.target.files[0]; e.target.value = ""; if(f) onPhoto(f); };
$("#photoDel").onclick = clearPhoto;
$("#go").onclick = ask;
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter" && (e.ctrlKey||e.metaKey)) ask(); });
$("#next").onclick = ()=>goStep(cur.idx+1);
$("#prev").onclick = ()=>goStep(cur.idx-1);
$("#all").onclick = ()=>{ cur.idx = cur.steps.length-1; renderSteps(); document.querySelectorAll(".step").forEach(s=>s.classList.remove("active")); playAnim(); };
$("#play").onclick = playAnim;
$("#tts").onchange = ()=>{ if(!$("#tts").checked){ try{ speechSynthesis.cancel(); }catch(e){} } };
$("#bankRows").onclick = async e=>{
  const btn = e.target.closest("button[data-act]"); if(!btn) return;
  const b = bankCache.find(x=>x.id===btn.dataset.id); if(!b) return;
  const act = btn.dataset.act;
  if(act==="view"){ showTab("ask"); $("#q").value = b.question; $("#stu").value = ""; ask(); return; }
  if(!canEdit()) return;
  try{
    if(act==="approve") await Store.setStatus(b.id, b.status==="已審核" ? "待審核" : "已審核");
    if(act==="del"){ if(!confirm("確定要從題庫刪除這題嗎？")) return; await Store.remove(b.id); }
    loadBankView();
  }catch(err){ alert("操作失敗：" + saveErrText(err)); }
};
$("#export").onclick = ()=>{
  const blob = new Blob([JSON.stringify(bankCache, null, 2)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "理化題庫備份.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};
$("#clear").onclick = async ()=>{
  if(!canEdit() || !confirm("確定要清空整個題庫嗎？這個動作無法復原。")) return;
  try{ await Store.clearAll(bankCache.map(b=>b.id)); loadBankView(); }catch(err){ alert("清空失敗：" + saveErrText(err)); }
};
$("#learnList").onclick = e=>{ const b = e.target.closest("[data-lesson]"); if(b) openLesson(b.dataset.lesson); };
$("#unknown").onclick = e=>{ const b = e.target.closest("[data-lesson]"); if(b) openLesson(b.dataset.lesson, true); };
Scenes.load(null);
</script>
